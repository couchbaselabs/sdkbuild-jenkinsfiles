# ci-config.yaml — COUCHNODE (Couchbase Node.js SDK) defaults & support matrix.
#
# Source of truth, read by CI *and* local runs. Reviewable + gated in CI-core.
# Override at runtime via promoted vars (PLATFORMS/ARCHES/NODE_VERSIONS/
# ELECTRON_VERSIONS/RUNTIMES/USE_OPENSSL) or the CBCI_CONFIG_OVERRIDE JSON string.
# Merge precedence (most specific wins): this file < CBCI_CONFIG_OVERRIDE < promoted vars.
#
# IMPORTANT: this file holds ABSTRACT dimensions only. Concrete runner labels
# (qe-docker, m1, windows) and container images live in the vendor ADAPTER
# (jenkins.js), not here. See ../CONVENTIONS.md.

project: COUCHNODE

# --- support matrix ----------------------------------------------------------
support:
  # Node ships prebuilt N-API binaries always. A prebuild is ABI-stable across every
  # Node major version sharing the same napi_version — so node_versions/electron_versions
  # drive TEST fan-out only, never build fan-out (see build.napi_version below).
  node_versions: ["16.20.2", "18.20.4", "20.15.1", "22.14.0"]
  electron_versions: []   # populated per-run; empty = electron runtime not exercised

  runtimes: ["node", "electron"]

  architectures: ["x64", "arm64"]

  # Which abstract platforms are supported per arch. platform ∈
  # {linux, alpine, macos, windows}; linux/alpine both need a libc flavor (see build.libc).
  platforms:
    x64:   ["linux", "alpine", "macos", "windows"]
    arm64: ["linux", "alpine", "macos"]

  # Alpine+arm64+electron is unsupported today (carried forward from the legacy
  # pipeline's own documented gap, JSCBC-1268) — not solved in this phase.
  unsupported:
    - { platform: "alpine", arch: "arm64", runtime: "electron" }

# --- build defaults ----------------------------------------------------------
build:
  ssl: boringssl            # boringssl | openssl
  openssl_version: null     # only used when ssl == openssl
  build_type: RelWithDebInfo
  set_cpm_cache: true       # bake the C++ core's CPM cache (deps/couchbase-cxx-cache)
                            # into the sdist tarball before it's built into prebuilds
  verbose_makefile: false

  # napi_version: the N-API level the C++ addon targets. Informational/documentation
  # only — it is HARDCODED at compile time (CMakeLists.txt: `-DNAPI_VERSION=6`), not an
  # env-driven build input, so tasks.sh has nothing to pass for it. It stays in config to
  # justify (and let validateConfig assert) the "ONE build serves every node_versions
  # entry" claim: bumping the compiled floor is a deliberate source-code change, not a
  # per-run knob.
  napi_version: 6

  # libc flavors per platform — drives build-unit keys and image selection (Node's
  # analog of Python's manylinux/musllinux split).
  libc:
    linux: manylinux         # oldest-glibc floor picked by jenkins.js's family table
    alpine: musllinux

# --- test defaults -----------------------------------------------------------
test:
  install_types: ["prebuild", "sdist"]   # prebuild = ship binary; sdist = build-from-source fallback
  cluster: mock                          # mock (CouchbaseMock.jar) | realserver
  skip_integration: true                 # gate for the (later) integration pipeline

  mocha:
    cmd: "npm run test"
    # CouchbaseMock.jar needs a `java` runtime on the test agent — tasks.sh/tasks.ps1
    # check for it before falling back to a real cluster via CNCSTR.
    require_java: true

  # Neutral real-cluster spec, mirrors Python's test.integration shape (see
  # ci-config.yaml in couchbase-sdk-ci/python/). Provisioning stays adapter/groovy-only
  # (cbdyncluster on Jenkins) — deferred to the later Node.js integration-pipeline phase.
  integration:
    server_versions:
      - ["6.6-release", "7.0-release", "7.1-release"]
      - ["7.2-release", "7.6-stable"]
      - ["8.0-stable"]
    version_subset: true
    num_nodes: 3
    ram_quota: 2048
    storage_mode: plasma
    buckets: ["default"]
    sample_buckets: ["beer-sample"]
    developer_preview: false

  skip_cbdino: true

# --- packaging / publish defaults ---------------------------------------------
publish:
  publish_npm: true             # node prebuilds -> optionalDependencies packages -> npm
  publish_electron_npm: false   # Electron stays S3-only / gated (experimental support)
  publish_dry_run: false
