# ci-config.yaml - COUCHNODE (Couchbase Node.js SDK) defaults and support matrix.
#
# Source of truth, read by CI *and* local runs. Reviewable + gated in CI-core.
# Override at runtime via promoted vars (PLATFORMS/ARCHES/NODE_VERSIONS/
# VALIDATE_NODE_VERSIONS/BUILD_NODE_VERSION/ELECTRON_VERSIONS/RUNTIMES/USE_OPENSSL) or the
# CBCI_CONFIG_OVERRIDE JSON string.
# Merge precedence (most specific wins): this file < CBCI_CONFIG_OVERRIDE < promoted vars.
#
# IMPORTANT: this file holds ABSTRACT dimensions only. Concrete runner labels
# (qe-docker, m1, windows) and container images live in the vendor ADAPTER
# (jenkins.mjs), not here. See ../CONVENTIONS.md.

project: COUCHNODE

# --- support matrix ----------------------------------------------------------
support:
  # Node ships prebuilt N-API binaries always. A prebuild is ABI-stable across every
  # Node major version sharing the same napi_version, so these lists drive validate and
  # test fan-out only, never build fan-out (see build.napi_version and build.node_version).
  #
  # node_versions: the test cells of any runner without its own node_versions (Vitest).
  # NODE_VERSIONS replaces the list of whichever runner is selected.
  node_versions: ["22.14.0", "24.21.0", "26.11.1"]

  # validate_node_versions: the pool the validate stage installs on, narrowed per checkout
  # to the SDK package.json's engines.node, so each branch is validated where it claims to
  # run. min_commit marks the commit that added support for that Node major.
  # VALIDATE_NODE_VERSIONS replaces it and skips the engines filter.
  validate_node_versions:
    - "16.20.2"
    - { version: "18.20.4", min_commit: "96eec70793a68626dbf35a8ace0daef95c40b1f3" }
    - { version: "20.20.2", min_commit: "96eec70793a68626dbf35a8ace0daef95c40b1f3" }
    - { version: "22.14.0", min_commit: "8350f7c7eb4674f553072a4790d5a88a4a2e970c" }
    - { version: "24.21.0", min_commit: "15a72e9a8df92cca32bc780d98935d22bc26f523" }
    - { version: "26.11.1", min_commit: "15a72e9a8df92cca32bc780d98935d22bc26f523" }
  electron_versions: []   # populated per-run; empty = electron runtime not exercised

  runtimes: ["node", "electron"]

  architectures: ["x64", "arm64"]

  # Which abstract platforms are supported per arch. A platform is one of linux,
  # alpine, macos, windows. linux and alpine both need a libc flavor (see build.libc).
  platforms:
    x64:   ["linux", "alpine", "macos", "windows"]
    arm64: ["linux", "alpine", "macos"]

  # Alpine + arm64 + electron is unsupported (JSCBC-1268).
  unsupported:
    - { platform: "alpine", arch: "arm64", runtime: "electron" }

# --- build defaults ----------------------------------------------------------
build:
  ssl: boringssl            # boringssl | openssl
  openssl_version: null     # only used when ssl == openssl
  build_type: RelWithDebInfo
  set_cpm_cache: true       # bake the C++ core's CPM cache (deps/couchbase-cxx-cache)
                            # into the sdist tarball before it's built into prebuilds
  # The Mozilla CA bundle the C++ core embeds (ca_bundle_check.mjs). The sdist bakes whatever
  # curl.se serves that day, so these are checked on the sdist's bundle, on every prebuild,
  # and again at package. Fingerprints are SHA-256 of the DER cert; the name is only a comment.
  ca_bundle:
    min_date: "2026-10-20"  # oldest acceptable bundle; raise it after a distrust event
    min_certs: 100          # catches a parser that silently embeds nothing (CXXCBC-1112)
    denied_sha256:          # CBSE-24000: emSign roots Mozilla distrusted
      - 86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b  # emSign ECC Root CA - G3
      - 125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f  # emSign Root CA - C1
      - bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3  # emSign ECC Root CA - C3
  # Strip the "# Fingerprint" lines curl added in Oct 2026; core < 1.5.1 parses zero certs
  # without this. drop_commit = the SDK commit that bumps the core to 1.5.1.
  ca_bundle_normalize:
    enabled: true
    drop_commit: "c241e92ba44de4ef401c2e110a3707b2d6030d20"
  verbose_makefile: false

  # node_version: the Node the prebuild build runs cmake-js under. A FLOOR: the oldest Node
  # is the safe default, and where a platform's agents cannot start it (alpine arm64 begins
  # at 18) jenkins.mjs raises it to the oldest validate/test version they can.
  # BUILD_NODE_VERSION replaces it.
  node_version: "16.20.2"

  # napi_version: the highest N-API level any supported branch compiles. The level itself is
  # HARDCODED per branch (CMakeLists.txt: `-DNAPI_VERSION=<n>`), and the prebuild name reads
  # it from the checkout, so this value never reaches a build. It exists so validateConfig
  # can assert the "ONE build serves every node_versions entry" claim, and validate-config
  # fails if a checkout compiles a higher level than this.
  napi_version: 8

  # libc flavors per platform. Drives build-unit keys and image selection.
  libc:
    linux: manylinux         # oldest-glibc floor picked by jenkins.mjs's family table
    alpine: musllinux

# --- test defaults -----------------------------------------------------------
test:
  install_types: ["prebuild", "sdist"]   # prebuild = ship binary; sdist = build-from-source fallback
  cluster: mock                          # mock (CouchbaseMock.jar) | realserver
  skip_integration: true                 # gate for the (later) integration pipeline

  # The validate stage: install, require, cbppMetadata, and optionally a KV round-trip.
  validate:
    kv_smoke: false                # KV round-trip against GoCAVES; release-verify turns it on
    gocaves_version: v0.0.1-78
    yarn_linker: pnp               # pnp | node-modules (Berry only; pnp is Berry's own default)
    # Exact yarn versions for registry-mode installs with CBCI_VALIDATE_PACKAGE_MANAGER=yarn|yarn-classic,
    # npm-installed into the run's temp dir (Node 25+ ships no corepack)
    yarn:
      berry: 4.18.1                # Node >= 18.12
      berry_below_node18: 3.6.1    # Yarn 4 needs Node >= 18.12
      classic: 1.22.22

  # Test runners, in selection order: the first whose `when_exists` file is in the SDK
  # checkout wins, so each sha picks the suite it carries with no edit here. `opt_in`
  # entries run only when CBCI_TEST_RUNNER (the TEST_RUNNER job param) names them.
  #   junit: mocha-multi-reporters  tasks.sh/tasks.ps1 install and append that reporter
  #   junit: inline                 cmd writes xunit.xml itself; the task checks it did
  #   junit_env                     the task sets this env var to xunit.xml's absolute path
  #                                 (couchnode's CNJUNIT: its own reporter, which keeps skip
  #                                 reasons). The cmd must not pass --reporter, which would
  #                                 replace the config's reporters.
  #   node_versions                 the Node versions this runner tests on (default
  #                                 support.node_versions); gated like the support lists
  #   min_node                      test cells below this Node major are dropped, so a
  #                                 NODE_VERSIONS override cannot start the suite on a
  #                                 Node it does not run on
  #   tier                          exported as CNTIER (fast|slow|nightly) unless the
  #                                 TEST_TIER job param or CNTIER is set. nightly matches
  #                                 the mocha suite, which had no tiers and ran everything
  # The Vitest commands list the three default projects instead of `--project '!periodic'`:
  # npm and npx run through cmd.exe on Windows, where single quotes are literal.
  runners:
    - name: vitest
      when_exists: test/vitest.config.mts
      cmd: "npx vitest run --config test/vitest.config.mts --project unit --project integration --project exclusive"
      junit: inline
      junit_env: CNJUNIT
      tier: nightly
      min_node: 20               # vitest 4 engines: ^20 || ^22 || >=24
    - name: vitest-v2            # test/v2 before it replaces test/
      opt_in: true
      when_exists: test/v2/vitest.config.mts
      cmd: "npx vitest run --config test/v2/vitest.config.mts --project unit --project integration --project exclusive"
      junit: inline
      junit_env: CNJUNIT
      tier: nightly
      min_node: 20
    - name: mocha                # fallback: pre-cutover shas and maintenance branches
      cmd: "npm run test"
      junit: mocha-multi-reporters
      # CouchbaseMock.jar needs a `java` runtime on the test agent, so tasks.sh/tasks.ps1
      # check for it before falling back to a real cluster via CNCSTR.
      require_java: true
      node_versions:
        - "16.20.2"
        - { version: "18.20.4", min_commit: "96eec70793a68626dbf35a8ace0daef95c40b1f3" }
        - { version: "20.20.2", min_commit: "96eec70793a68626dbf35a8ace0daef95c40b1f3" }
        - { version: "22.14.0", min_commit: "8350f7c7eb4674f553072a4790d5a88a4a2e970c" }

  # Neutral real-cluster spec. Provisioning stays adapter/groovy-only (cbdyncluster on
  # Jenkins) and is not implemented yet.
  integration:
    server_versions:
      - ["7.0-stable", "7.1-stable"]
      - ["7.2-stable", "7.6-stable"]
      - ["8.0-stable"]
    version_subset: true
    num_nodes: 3
    ram_quota: 2048
    storage_mode: plasma
    buckets: ["default"]
    sample_buckets: ["beer-sample"]
    developer_preview: false

  skip_cbdino: true

# --- packaging / publish defaults ---------------------------------------------
publish:
  publish_npm: true             # node prebuilds -> optionalDependencies packages -> npm
  publish_electron_npm: false   # Electron stays S3-only / gated (experimental support)
  publish_dry_run: false
